name: Publicar sitio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'resultados/resultados_lapaz.json'
      - 'resultados/candidatos.json'
      - 'vista/src/**'

permissions:
  contents: write

jobs:
  publish:
    name: compilar y publicar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Setup docs
        run: |
          mkdir -p docs
          touch docs/.nojekyll

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: vista/package-lock.json

      - name: Instalar dependencias
        working-directory: ./vista
        run: npm install

      - name: Build
        working-directory: ./vista
        run: npm run build

      - name: Asegurar .nojekyll
        run: touch ./docs/.nojekyll

      - name: Publicar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
