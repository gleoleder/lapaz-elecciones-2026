name: Actualizar datos La Paz

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: descargar, procesar y sincronizar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: resultados/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r resultados/requirements.txt

      - name: Descargar datos OEP
        run: python resultados/actualizar.py

      - name: Procesar datos La Paz
        run: python resultados/preparar.py

      - name: Commit y push
        run: |
          git config --global user.name "actions-bot"
          git config --global user.email "actions-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Actualizar datos $(date -u '+%Y-%m-%d %H:%M UTC')" && git push)
