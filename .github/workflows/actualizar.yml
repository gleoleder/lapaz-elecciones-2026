name: Actualizar datos La Paz

# DATOS CONGELADOS: el schedule automático fue desactivado el 2026-05-25
# porque los datos finales de las elecciones ya están capturados.
#
# Para reactivar la actualización automática cada 15 minutos, descomentar:
#
#   schedule:
#     - cron: '*/15 * * * *'
#
# Flujo de actualización:
#   1. actualizar.py  — descarga Excel desde la API del OEP:
#        POST https://computo.oep.org.bo/api/v1/descargar
#        body: {"tipoArchivo": "excel", "idDepartamento": 2}
#        La respuesta trae el archivo en Base64; el script lo decodifica
#        y guarda los CSV en resultados/la-paz/alcaldesaalcalde/
#   2. preparar.py    — lee los CSV, cruza con geo/recintos.gpkg y genera
#        resultados/resultados_lapaz.json y resultados/candidatos.json
#   3. El bot hace commit + push; publicar.yml detecta el cambio y
#        recompila el sitio en GitHub Pages.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: resultados/requirements.txt

      - run: pip install -r resultados/requirements.txt

      - run: python resultados/actualizar.py

      - run: python resultados/preparar.py

      - name: Commit y push
        run: |
          git config --global user.name "actions-bot"
          git config --global user.email "actions-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Actualizar datos $(date -u '+%Y-%m-%d %H:%M UTC')" && git push)
